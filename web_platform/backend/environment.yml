name: alankrit-medrax2
channels:
  - conda-forge
  - pytorch
  - nvidia # CUDA support
  - defaults
dependencies:
  # Python
  - python=3.11
  - pip

  # Core ML/Scientific Stack (via conda for optimized binaries)
  # Note: pytorch from conda will auto-detect CUDA and install GPU version if available
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1 # Explicit CUDA support (compatible with CUDA 12.4)
  - numpy>=1.24,<2.0
  - scipy>=1.10.0
  - pandas=2.2.3
  - matplotlib=3.8.3
  - pillow>=10.3.0
  - opencv=4.*
  - scikit-image=0.22.0

  # Medical Imaging
  - pydicom>=2.4.0
  - simpleitk>=2.2.0

  # Fix OpenMP duplicate library issue on macOS
  - llvm-openmp

  # Everything else via pip (not available in conda or needs specific versions)
  - pip:
      # Backend Framework
      - fastapi==0.115.4
      - uvicorn[standard]==0.32.0
      - python-multipart==0.0.12
      - python-jose[cryptography]==3.3.0
      - bcrypt==4.1.3
      - pydantic==2.9.2
      - pydantic-settings==2.11.0

      # Database
      - sqlalchemy==2.0.35
      - alembic==1.13.3

      # HTTP & Networking
      - httpx==0.28.1
      - requests==2.32.5
      - aiofiles==25.1.0

      # Testing
      - pytest==8.3.3
      - pytest-asyncio==0.24.0
      - pytest-cov==5.0.0
      - anyio==4.11.0

      # System utilities
      - psutil>=5.9.0

      # Environment & Configuration
      - python-dotenv==1.0.1
      - python-decouple==3.8

      # ML/AI Frameworks
      - transformers>=4.43.0,<4.44.0
      - diffusers==0.35.2
      - safetensors==0.4.2
      - accelerate==0.27.2

      # HuggingFace Ecosystem
      - huggingface-hub==0.35.3
      - datasets==4.2.0
      - sentencepiece==0.2.0
      - protobuf==4.25.3

      # LangChain Framework
      - langchain==0.3.27
      - langchain-core==0.3.79
      - langchain-community==0.3.31
      - langchain-experimental==0.3.4
      - langchain-cohere==0.4.6
      - langchain-pinecone==0.2.12
      - langchain-openai==0.3.35
      - langchain-google-genai==2.0.6
      - langgraph==0.2.62
      - langgraph-checkpoint==2.0.14
      - langsmith==0.4.37

      # Vector Database & Search
      - pinecone==6.0.0
      - cohere==5.19.0
      - duckduckgo-search==4.4.3

      # Medical Imaging - Specialized Models
      - torchxrayvision==1.2.1
      - timm==0.9.16
      - albumentations==1.4.0

      # GPU Acceleration & Model Loading
      - bitsandbytes>=0.42.0 # GPU quantization support

      # Configuration & Utilities
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - tqdm>=4.65.0
      - einops>=0.6.0

      # Additional Dependencies
      - beautifulsoup4==4.12.3
      - lxml>=5.1.0
      - jinja2==3.1.6
